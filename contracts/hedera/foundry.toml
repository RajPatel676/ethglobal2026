[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
# Hedera implements the Cancun opcode set except blobs (HIP-866), but `shanghai` is the
# conservative choice for HTS/ATS work: it avoids TSTORE/MCOPY codegen that has bitten
# Hedera deployments. Bump to `cancun` only after verifying on testnet.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
hedera_testnet = "${HEDERA_JSON_RPC}"

[fmt]
line_length = 110
tab_width = 4
